<header class="sticky top-0 z-10 border-b border-slate-200/80 bg-white/95 shadow-sm backdrop-blur dark:border-slate-800/80 dark:bg-slate-900/95">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a routerLink="/" class="flex items-center gap-2.5">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white p-1 shadow-sm ring-1 ring-slate-200"
        aria-hidden="true"
      >
        <img
          src="https://cdn.msaaq.com/academies/273908/group-578-1-removebg-preview.png"
          alt=""
          class="h-full w-full object-contain"
        />
      </span>
      <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-slate-50">{{ 'app.name' | translate }}</span>
    </a>

    <nav class="hidden items-center gap-1 sm:flex">
      <a
        routerLink="/"
        routerLinkActive="bg-primary-600 text-white shadow-sm"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        {{ 'nav.home' | translate }}
      </a>
      <a
        routerLink="/courses"
        routerLinkActive="bg-primary-600 text-white shadow-sm"
        class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        {{ 'nav.courses' | translate }}
      </a>
    </nav>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="toggleTheme()"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-slate-50 text-base transition hover:border-primary-300 hover:bg-primary-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary-700 dark:hover:bg-slate-700"
        [attr.aria-label]="(themeService.isDark() ? 'common.lightMode' : 'common.darkMode') | translate"
      >
        <span aria-hidden="true">{{ themeService.isDark() ? '☀️' : '🌙' }}</span>
      </button>

      <button
        type="button"
        (click)="toggleLanguage()"
        class="hidden items-center gap-1.5 rounded-full border border-slate-200 bg-slate-50 px-3.5 py-2 text-sm font-semibold text-slate-700 transition hover:border-primary-300 hover:bg-primary-50 hover:text-primary-700 sm:flex dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:border-primary-700 dark:hover:bg-slate-700"
      >
        <span aria-hidden="true">{{ languageService.language() === 'ar' ? 'AR' : 'EN' }}</span>
      </button>
      <button
        type="button"
        (click)="toggleLanguage()"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-slate-50 text-base transition hover:border-primary-300 hover:bg-primary-50 sm:hidden dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary-700 dark:hover:bg-slate-700"
      >
        <span aria-hidden="true">{{ languageService.language() === 'ar' ? 'AR' : 'EN' }}</span>
      </button>

      @if (authService.currentUser(); as user) {
        <div class="relative">
          <button
            type="button"
            (click)="toggleUserMenu()"
            class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 py-1.5 ps-1.5 pe-3 transition hover:border-primary-300 hover:bg-primary-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-primary-700 dark:hover:bg-slate-700"
          >
            <span class="flex h-7 w-7 items-center justify-center rounded-full bg-primary-600 text-sm font-bold text-white" aria-hidden="true">
              {{ user.name.charAt(0) }}
            </span>
            <span class="hidden text-sm font-semibold text-slate-700 sm:inline dark:text-slate-200">{{ user.name }}</span>
          </button>

          @if (userMenuOpen()) {
            <div
              class="absolute end-0 z-20 mt-2 w-48 rounded-xl border border-slate-200 bg-white p-1.5 shadow-lg dark:border-slate-700 dark:bg-slate-800"
            >
              <p class="truncate px-3 py-2 text-xs text-slate-400">{{ user.email }}</p>
              <button
                type="button"
                (click)="logout()"
                class="w-full rounded-lg px-3 py-2 text-start text-sm font-medium text-red-600 transition hover:bg-red-50 dark:hover:bg-red-950/40"
              >
                {{ 'auth.logout' | translate }}
              </button>
            </div>
          }
        </div>
      } @else {
        <a
          routerLink="/login"
          class="rounded-full bg-primary-600 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-primary-700"
        >
          {{ 'auth.loginCta' | translate }}
        </a>
      }
    </div>
  </div>

  <nav class="flex items-center gap-1 border-t border-slate-100 px-4 py-2 sm:hidden dark:border-slate-800">
    <a
      routerLink="/"
      routerLinkActive="bg-primary-600 text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-full px-4 py-1.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
    >
      {{ 'nav.home' | translate }}
    </a>
    <a
      routerLink="/courses"
      routerLinkActive="bg-primary-600 text-white"
      class="rounded-full px-4 py-1.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
    >
      {{ 'nav.courses' | translate }}
    </a>
  </nav>
</header>
