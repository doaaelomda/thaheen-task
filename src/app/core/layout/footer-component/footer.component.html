<footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
  <div class="mx-auto flex max-w-6xl flex-col items-center gap-1.5 px-4 py-5 text-center sm:px-6">
    <div class="flex items-center gap-1.5">
      <span
        class="flex h-6 w-6 items-center justify-center rounded-md bg-white p-1 ring-1 ring-slate-200"
        aria-hidden="true"
      >
        <img
          src="https://cdn.msaaq.com/academies/273908/group-578-1-removebg-preview.png"
          alt=""
          class="h-full w-full object-contain"
        />
      </span>
      <span class="text-sm font-bold text-slate-800 dark:text-slate-100">{{ 'app.name' | translate }}</span>
    </div>
    <p class="max-w-md text-xs text-slate-500 dark:text-slate-400">{{ 'app.tagline' | translate }}</p>
    <p class="text-xs text-slate-400 dark:text-slate-500">{{ 'app.rights' | translate: { year } }}</p>
  </div>
</footer>
